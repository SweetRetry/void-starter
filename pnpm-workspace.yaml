packages:
  - "apps/*"
  - "packages/*"
# Audit fixes for advisories that reach us only through transitive trees.
# `braces` has no patched release (registry latest is still 3.0.3), so it stays until
# markdownlint-cli2 and shadcn drop micromatch. `esbuild` is pinned at 0.18.20 by
# drizzle-kit's deprecated @esbuild-kit loader and cannot cross a major through an override.
overrides:
  # 1.65.0 and 1.66.0 leave workerd running after prerender, so `vp build` never exits.
  # Drop this pin once a newer release builds and exits on its own.
  "@cloudflare/vite-plugin": 1.64.0
  next: ^16.3.8
  katex: ^0.19.0
  markdown-it: ^15.0.3
  "vitest@4": ^4.1.12 || ^5.0.0
  smol-toml: ^1.9.1
  source-map-js: ^1.2.2
# `vite` is an alias for @voidzero-dev/vite-plus-core, which versions as 1.x while
# plugins ask for vite >=5 to ^8. Accept the alias so peer checks stay clean.
peerDependencyRules:
  allowedVersions:
    vite: "1"
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lefthook: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  - vitest@5.0.5
