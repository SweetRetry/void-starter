packages:
  - "apps/*"
  - "packages/*"
# Audit fixes for advisories that reach us only through transitive trees.
# `braces` has no patched release (registry latest is still 3.0.3), so it stays until
# markdownlint-cli2 and shadcn drop micromatch. `esbuild` is pinned at 0.18.20 by
# drizzle-kit's deprecated @esbuild-kit loader and cannot cross a major through an override.
overrides:
  next: ^16.3.8
  katex: ^0.19.0
  markdown-it: ^15.0.3
  "vitest@4": ^4.1.12 || ^5.0.0
  smol-toml: ^1.9.1
  source-map-js: ^1.2.2
# `vite` is an alias for @voidzero-dev/vite-plus-core, which versions as 1.x while
# plugins ask for vite >=5 to ^8. Accept the alias so peer checks stay clean.
peerDependencyRules:
  allowedVersions:
    vite: "1"
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lefthook: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  - vitest@5.0.5
  - "@cloudflare/build-output-utils@0.9.13"
  - "@cloudflare/codemods@0.7.7"
  - "@cloudflare/config@0.32.0"
  - "@cloudflare/runtime-types@0.1.26"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.15"
  - "@cloudflare/workers-auth@0.18.1"
  - "@cloudflare/workers-utils@0.53.1"
  - "@void/deploy-cloudflare@1.8.0"
  - "@void/deploy-core@1.8.0"
  - "@void/edge@1.8.0"
  - "@void/isr@1.8.0"
  - "@void/platform@1.8.0"
  - cf@1.0.0-beta.30
  - hono@4.13.18
  - miniflare@5.20261110.1-beta
  - void@1.8.0
