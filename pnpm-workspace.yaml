packages:
  - "apps/*"
  - "packages/*"
# Audit fixes for advisories that reach us only through transitive trees.
# `braces` has no patched release (registry latest is still 3.0.3), so it stays until
# markdownlint-cli2 and shadcn drop micromatch. `esbuild` is pinned at 0.18.20 by
# drizzle-kit's deprecated @esbuild-kit loader and cannot cross a major through an override.
overrides:
  next: ^16.3.8
  katex: ^0.19.0
  smol-toml: ^1.9.1
  source-map-js: ^1.2.2
allowBuilds:
  better-sqlite3: false
  esbuild: true
  lefthook: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  - "@void/deploy-cloudflare@1.1.11"
  - "@void/deploy-core@1.1.11"
  - "@void/edge@1.1.11"
  - "@void/isr@1.1.11"
  - "@void/platform@1.1.11"
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - framer-motion@14.3.0
  - motion-dom@14.3.0
  - motion@14.3.0
  - vite-plus@1.3.0
  - vitest@5.0.5
  - void@1.1.11
  - cn@0.5.0
